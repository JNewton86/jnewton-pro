version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      lint-and-format:
        patterns:
          ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier*', 'globals', 'typescript']
      fonts:
        patterns: ['@fontsource/*', '@fontsource-variable/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
