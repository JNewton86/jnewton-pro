version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      lint-and-format:
        patterns:
          ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier*', 'globals', 'typescript']
      fonts:
        patterns: ['@fontsource/*', '@fontsource-variable/*']
    ignore:
      # TypeScript 7 isn't supported yet by @astrojs/check (peer: ^5 || ^6) or
      # typescript-eslint (peer: <6.1) as of 2026-10-17, so `npm ci` fails on it.
      # Remove this once both accept TypeScript 7 (check their peerDependencies).
      - dependency-name: 'typescript'
        versions: ['>=7']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
